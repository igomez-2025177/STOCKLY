@if (abierto()) {
  <div class="modal-fondo" (click)="alClicAfuera()">
    <div
      class="modal"
      [class.modal-grande]="tamano() === 'grande'"
      [class.rebote]="rebotando()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="titulo()"
      (click)="$event.stopPropagation()"
    >
      <header class="modal-encabezado">
        <h3>{{ titulo() }}</h3>
        <button type="button" class="modal-cerrar" (click)="cerrar.emit()" aria-label="Cerrar" title="Cerrar">
          ✕
        </button>
      </header>

      <div class="modal-cuerpo">
        <ng-content />
      </div>
    </div>
  </div>
}
