@if (abierto()) {
  <div class="modal-fondo" (click)="cerrar.emit()">
    <div
      class="modal"
      [class.modal-grande]="tamano() === 'grande'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="titulo()"
      (click)="$event.stopPropagation()"
    >
      <header class="modal-encabezado">
        <h3>{{ titulo() }}</h3>
        <button type="button" class="btn btn-fantasma btn-sm" (click)="cerrar.emit()" aria-label="Cerrar">✕</button>
      </header>

      <div class="modal-cuerpo">
        <ng-content />
      </div>
    </div>
  </div>
}
